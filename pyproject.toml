[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockai"
version = "1.0.0"
description = "StockAI: Autonomous Supply Chain & Inventory Automation Multi-Agent Framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "StockAI Supply Chain Labs", email = "supply@stockai.dev" }]
keywords = ["inventory-automation", "demand-forecasting", "reorder-agent", "supply-chain", "sme-efficiency"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.setuptools.packages.find]
# Flat layout also has an api/ dir (Vercel serverless entrypoint) at repo root;
# scope package discovery to stockai/ only so builds don't treat api/ as a package.
include = ["stockai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
