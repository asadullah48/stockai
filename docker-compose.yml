version: '3.8'

services:
  stockai-gateway:
    build: .
    container_name: stockai-gateway
    ports:
      - "8019:8019"
    environment:
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8019/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always
